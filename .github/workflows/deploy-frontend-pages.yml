# DEPRECATED para GitHub Pages — o portal migrou para SSR + ISR e não pode mais
# ser servido por um file server estático (Pages). Este workflow agora apenas
# valida que o build SSR/ISR passa. Configure o deploy no seu host (Vercel/
# Railway/Fly/Render/etc) rodando `next build` + `next start` — veja os hooks
# de deploy do host escolhido.
name: Validate frontend build (SSR/ISR)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build SSR/ISR
        run: npm run build
