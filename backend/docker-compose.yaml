services:
  postgres:
    image: postgres:17.6-alpine
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - boilerplate-db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  maildev:
    build:
      context: .
      dockerfile: maildev.Dockerfile
    ports:
      - ${MAIL_CLIENT_PORT}:1080
      - ${MAIL_PORT}:1025

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  # Uncomment to use redis
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - 6379:6379

  # Storage S3-compatible para desenvolvimento local. Simula o DigitalOcean
  # Spaces usado em produção: nos dois casos o fluxo é
  # "endpoint customizado + credenciais + bucket".
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - ${MINIO_PORT:-9000}:9000
      - ${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
      - boilerplate-minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 12

  # Job de bootstrap (não é serviço de longa duração): cria o bucket de
  # desenvolvimento e libera leitura anônima, depois encerra. É idempotente
  # (`--ignore-existing`), então o segundo `docker compose up` não quebra.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_S3_BUCKET: ${AWS_DEFAULT_S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$AWS_DEFAULT_S3_BUCKET"
        mc anonymous set download "local/$$AWS_DEFAULT_S3_BUCKET"
        echo "✅ bucket '$$AWS_DEFAULT_S3_BUCKET' pronto (leitura pública habilitada)"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env # crie a partir do env-example-relational: cp env-example-relational .env
    environment:
      # A API roda DENTRO da rede Docker, então os hosts abaixo são nomes de
      # serviço, não `localhost` (que aqui seria o próprio container).
      DATABASE_HOST: postgres
      # ⚠️ NÃO confundir as duas envs de S3:
      #   AWS_S3_ENDPOINT   -> quem usa é o BACKEND, para falar com o storage.
      #                        Dentro da rede Docker o host é `minio`, por isso
      #                        sobrescrevemos aqui (no .env ela aponta para
      #                        localhost, que serve ao perfil docker-compose-dev).
      #   AWS_S3_PUBLIC_URL -> quem usa é o NAVEGADOR do usuário, que está no
      #                        host. Por isso ela NÃO é sobrescrita e continua
      #                        valendo o valor do .env (localhost). Trocar essa
      #                        para `minio:9000` deixaria as URLs dos arquivos
      #                        inacessíveis fora do Docker.
      AWS_S3_ENDPOINT: http://minio:9000
      # Endpoint usado só para ASSINAR URLs entregues ao navegador (driver
      # s3-presigned). O host entra na assinatura, então precisa ser o que o
      # cliente resolve — `minio:9000` não sai da rede Docker. A porta 9000 do
      # MinIO é publicada no host, por isso `localhost` funciona aqui.
      AWS_S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9000}
    ports:
      - ${APP_PORT}:${APP_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      # Espera o bucket existir, não só o MinIO responder — senão o primeiro
      # upload poderia falhar com NoSuchBucket numa stack recém-criada.
      minio-init:
        condition: service_completed_successfully

volumes:
  boilerplate-db:
  boilerplate-minio:
